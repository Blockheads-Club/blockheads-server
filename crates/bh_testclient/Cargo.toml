[package]
name = "bh_testclient"
description = "Protocol test client and parity diff harness for the Blockheads server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bh_testclient"
path = "src/lib.rs"

[features]
# JVM mods on a live server (needs a JDK to build the fixture mod and a JRE to run it).
jvm = ["blockheads_server/jvm"]

[dependencies]
blockheads_server = { path = "../blockheads_server", features = ["trace-rng"] }
rusty_enet = { workspace = true }
heed = { workspace = true }
flate2 = { workspace = true }
md-5 = { workspace = true }
base64 = { workspace = true }
bhmod-proto = { workspace = true }
sha2 = "0.10"
[dev-dependencies]
tempfile = "3"
bhmod-core = { workspace = true }
bhmod-voice = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
