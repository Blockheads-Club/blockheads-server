[package]
name = "blockheads-server-app"
version = "0.4.0"
description = "Blockheads Server host app (desktop and Android)"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"
publish = false

# Own workspace root: keeps the GUI dependencies out of the server workspace (and its CI).
[workspace]

[lib]
name = "blockheads_server_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-hostservice = { path = "plugins/hostservice" }
blockheads_server = { path = "../../crates/blockheads_server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
# App updates: GitHub release feed, download, SHA-256 check (see src/update.rs). Also the mod list and mod packages
# (HTTPS, rustls with bundled roots: works on Android too).
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
semver = "1"
tauri-plugin-opener = "2"
# Mods: the same discovery, manifest checks and dependency rules as the server's mod host, from mod-sdk at the rev the
# server workspace pins (keep them equal; see docs/development.md for a local mod-sdk override).
bhmod-core = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
bhmod-manifest = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
# Edits mods.toml in place (comments, order and each mod's settings stay).
toml_edit = "0.25"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
# In-place desktop updates from the signed latest.json of a release (see src/update.rs).
tauri-plugin-updater = "2"

[features]
# JVM mods (Java/Kotlin, unsandboxed). Off by default: building needs a JDK (javac, jar); running needs a JRE and the
# switch in Settings. See docs/mods.md.
jvm = ["blockheads_server/jvm"]

[dev-dependencies]
tempfile = "3"

# The server emulates exception catch sites with unwinding: never abort on panic.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
strip = true

# Server thread CPU time from /proc (see src/stats.rs).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

