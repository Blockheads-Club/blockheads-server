[package]
name = "blockheads-server-app"
version = "0.1.1"
description = "Blockheads Server host app (desktop and Android)"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"
publish = false

# Own workspace root: keeps the GUI dependencies out of the server workspace (and its CI).
[workspace]

[lib]
name = "blockheads_server_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-hostservice = { path = "plugins/hostservice" }
blockheads_server = { path = "../../crates/blockheads_server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

# The server emulates exception catch sites with unwinding: never abort on panic.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
strip = true

# Server thread CPU time from /proc (see src/stats.rs).
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
