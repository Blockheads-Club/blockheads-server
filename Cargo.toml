[workspace]
resolver = "2"
members = ["crates/blockheads_server", "crates/bh_testclient", "crates/bh_tools"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rusty_enet = "0.4"
heed = { version = "0.22", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
# Not used directly: forces flate2's zlib backend to build the bundled C zlib (no system zlib needed when cross compiling).
libz-sys = { version = "1", default-features = false, features = ["static"] }
md-5 = "0.10"
base64 = "0.22"
libc = "0.2"
socket2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lmdb-master-sys = "=0.2.6"
anyhow = "1"
# The shared mod host and its WASM runtime, from Blockheads-Club/mod-sdk at a pinned commit. For local work on both
# repositories, override them with a sibling checkout (see docs/development.md, "Developing against a local mod-sdk").
bhmod-core = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "b32ff67afcab73494f7e2f69d44ebcaba14a9049" }
bhmod-wasm = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "b32ff67afcab73494f7e2f69d44ebcaba14a9049" }
bhmod-manifest = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "b32ff67afcab73494f7e2f69d44ebcaba14a9049" }
bhmod-proto = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "b32ff67afcab73494f7e2f69d44ebcaba14a9049" }
bhmod-content = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "b32ff67afcab73494f7e2f69d44ebcaba14a9049" }

# The original is a C/ObjC binary: unwinding is needed to emulate its exception catch sites.
[profile.dev]
panic = "unwind"
overflow-checks = true

[profile.release]
panic = "unwind"
overflow-checks = false
debug = 1

# Faithful float expressions (`x - x`, `x / x`, literal PI/TAU constants, `* 0`) are game behaviour, not mistakes.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
# `for x in option { .. }` is how the coverage-tested code avoids an uncovered closing brace after an `if let` without
# else (see notes/resume/server-coverage.md).
for_loops_over_fallibles = "allow"

[workspace.lints.clippy]
# `Some(x).filter(..)` keeps a test helper free of a never-run closure.
some_filter = "allow"
approx_constant = "allow"
eq_op = "allow"
erasing_op = "allow"

# Style lints that are pure noise for a line-by-line port of a C/ObjC binary: the shapes mirror the original, and the
# "simpler" forms either change float/NaN semantics or lose the one-to-one correspondence with the reference.
too_many_arguments = "allow"
type_complexity = "allow"
many_single_char_names = "allow"
cognitive_complexity = "allow"
# `!(a < b)` is not `a >= b` for NaN; the original compiles the negated compare.
neg_cmp_op_on_partial_ord = "allow"
# Identical branches mirror distinct branches of the original.
if_same_then_else = "allow"
# Float literals carry the digits of the original's constants.
excessive_precision = "allow"
# `x + 0`, `x * 1` and friends mirror the original's expressions.
identity_op = "allow"
# `new` constructors mirror the original's `init` methods that return other types.
new_ret_no_self = "allow"
# Rewrites of these would restructure ported control flow (and its coverage regions) for no behavioural gain.
field_reassign_with_default = "allow"
module_inception = "allow"
new_without_default = "allow"
len_without_is_empty = "allow"
large_enum_variant = "allow"
unnecessary_unwrap = "allow"
explicit_counter_loop = "allow"
needless_range_loop = "allow"
ptr_arg = "allow"
single_range_in_vec_init = "allow"
# `clamp` panics on min > max and treats NaN differently from the original's `if x < lo {..} else if x > hi {..}`.
manual_clamp = "allow"
